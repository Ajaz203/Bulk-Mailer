<!-- Dialog Header -->
<div class="dialog-header d-flex justify-content-between align-items-center">
  <h2 mat-dialog-title>{{ data?.name ? 'Edit Category' : 'Add New Category' }}</h2>
  <button mat-icon-button (click)="close()" aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>
</div>

<!-- Dialog Content -->
<mat-dialog-content>
  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Category Name</mat-label>
    <input
      matInput
      placeholder="Enter category name..."
      [(ngModel)]="userInput"
    />
  </mat-form-field>
</mat-dialog-content>

<!-- Dialog Actions -->
<mat-dialog-actions align="end">
  <button mat-stroked-button color="warn" (click)="close()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    [disabled]="!userInput.trim()"
    (click)="submit()"
  >
    {{ data?.name ? 'Update' : 'Add' }}
  </button>
</mat-dialog-actions>
