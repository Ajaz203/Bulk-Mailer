<!-- Container for Dialog -->
<div class="dialog-header">
  <h2 mat-dialog-title>Add New Category</h2>
  <button mat-icon-button (click)="close()" aria-label="Close" class="close-button">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-content">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Category Name</mat-label>
    <input matInput placeholder="Enter category name..." [(ngModel)]="userInput" />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-stroked-button color="warn" (click)="close()">Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()">Add Category</button>
</mat-dialog-actions>
