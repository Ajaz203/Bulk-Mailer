<!-- Top bar with title and close button -->
<div style="display: flex; justify-content: space-between; align-items: center; position: relative;">
  <h2 mat-dialog-title class="dialog-title">Add Category</h2>
  <button mat-icon-button (click)="close()" aria-label="Close" class="close-btn">
    <mat-icon>close</mat-icon>
  </button>
</div>

<hr>

<!-- Input Field -->
<mat-dialog-content>
  <mat-form-field appearance="outline" class="custom-input w-100">
    <mat-label>Enter Category</mat-label>
    <input matInput style="padding-left: 10px;" [(ngModel)]="userInput" />
  </mat-form-field>
</mat-dialog-content>

<!-- Action Buttons -->
<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancel</button>
  <button mat-button color="primary" (click)="submit()">OK</button>
</mat-dialog-actions>
