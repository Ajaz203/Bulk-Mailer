<div class="category-page container mt-4">

  <!-- Header with Add Button -->
 <div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="page-title">Category List</h3>
  <button class="btn btn-success" (click)="showForm = true">
    <i class="bi bi-plus-circle"></i> Add Category
  </button>
</div>

  <!-- Category Table -->
  <div class="table-responsive shadow-sm rounded border">
  <table class="table align-middle mb-0">
    <thead class="table-light">
      <tr>
        <th scope="col">S.No</th>
        <th scope="col">Category Name</th>
        <th scope="col">Created At</th>
        <th scope="col">Updated At</th>
        <th scope="col">Updated By</th>
        <th scope="col">Action</th> 
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of getDataArr; let i = index">
        <th scope="row">{{ i + 1 }}</th>
        <td>{{ item.name }}</td>
        <td>{{ item.createdAt | date: 'MM/dd/yyyy' }}</td>
        <td>{{ item.updatedAt | date: 'MM/dd/yyyy' }}</td>
        <td>{{ item.updated_by }}</td>
       
         <td style="cursor: pointer;" class="d-flex align-items-center  gap-3">

          <i class="bi bi-pencil-square text-dark fs-5" (click)="editCategory(item)" title="Edit">
          </i>

          <i class="bi bi-trash3 text-danger fs-5" (click)="deleteCategory(item)" title="Delete">
          </i>
        </td>
      </tr>

      <!-- No Data Found -->
      <tr *ngIf="getDataArr.length === 0">
        <td colspan="6" class="text-center text-muted">No categories available.</td>
      </tr>
    </tbody>
  </table>
</div>


</div>




<!-- Add Category Popup Form -->
<div class="popup-form" *ngIf="showForm">
  <div class="popup-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4>Add Category</h4>
      <button class="btn-close" (click)="showForm = false"></button>
    </div>
    <form (ngSubmit)="submitForm()" #categoryForm="ngForm">
      <div class="mb-3">
        <label class="form-label">Category Name</label>
        <input
          type="text"
          class="form-control"
          name="name"
          [(ngModel)]="newCategory.name"
          required
          placeholder="Enter category name"
        />
      </div>
      <div class="d-flex justify-content-end">
        <button type="button" class="btn btn-secondary me-2" (click)="showForm = false">
          Cancel
        </button>
        <button type="submit" class="btn btn-success" [disabled]="categoryForm.invalid">
          Save
        </button>
      </div>
    </form>
  </div>
</div>

<div class="popup-form" *ngIf="showEditForm">
  <div class="popup-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4>Edit Category</h4>
      <button class="btn-close" (click)="closeEditForm()"></button>
    </div>
    <form (ngSubmit)="updateCategory()" #editForm="ngForm">
      <div class="mb-3">
        <label class="form-label">Category Name</label>
        <input
          type="text"
          class="form-control"
          name="name"
          [(ngModel)]="selectedCategory.name"
          required
          placeholder="Enter category name"
        />
      </div>
      <div class="d-flex justify-content-end">
        <button type="button" class="btn btn-secondary me-2" (click)="closeEditForm()">
          Cancel
        </button>
        <button type="submit" class="btn btn-success" [disabled]="editForm.invalid">
          Update
        </button>
      </div>
    </form>
  </div>
</div>
