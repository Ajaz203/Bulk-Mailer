<div class="row">
    <div class="col-sm-12">
        <div class="card">
            <div class="card-header all-user-card card-header--2">
                <div>
                    <h5>Contact Enquiries</h5>
                </div>
            </div>

            <div class="card-body">
                <div class="table-responsive table-desi">
                    <table class="user-table table table-striped">
                        <thead>
                            <tr>
                                <!-- <th>S No</th> -->
                                <th>sr no</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone No</th>
                                <th>Subject</th>
                                <th>Message</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let contact of contacts; let i = index">
                                <td>{{ i + 1 }}</td>
                                <td>{{ contact.name }}</td>
                                <td>{{ contact.emailId }}</td>
                                <td>{{ contact.fullPhone }}</td>
                                <td>{{ contact.subject }}</td>
                                <td>{{ contact.messages }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>




        </div>
    </div>
</div>
