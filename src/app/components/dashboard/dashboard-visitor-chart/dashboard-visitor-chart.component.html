<div class="h-100">
  <div class="card o-hidden shadow  ">
    <div class="card-header">
      <div class="d-flex align-items-center justify-content-between ">
        <div class="card-header-title ">
          <h5>Emails Sent </h5>

        </div>

      </div>
    </div>
    <div class="card-body ">
      <div class="pie-chart">
        <div id="pie-chart-visitors">
          <apx-chart *ngIf="chartOptions && chartOptions.series" [series]="chartOptions.series" [chart]="chartOptions.chart" [labels]="chartOptions.labels"
            [colors]="chartOptions.colors" [plotOptions]="chartOptions.plotOptions"
            [dataLabels]="chartOptions.dataLabels" [legend]="chartOptions.legend"
            [responsive]="chartOptions.responsive">
          </apx-chart>

        </div>
      </div>
    </div>
  </div>
</div>
