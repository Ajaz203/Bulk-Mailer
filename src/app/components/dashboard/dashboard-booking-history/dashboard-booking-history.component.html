<div class="card shadow-sm border-0">
  <div class="card-header  d-flex justify-content-between align-items-center">
    <h5 class="card-header-title mb-0 fw-bold">Top 5 Users</h5>
    <span class="badge bg-primary text-white">This Week</span>
  </div>

  <div class="card-body p-0">
    <ul class="list-group list-group-flush">
      <li
        class="list-group-item d-flex align-items-center justify-content-between"
        *ngFor="let user of top5Users; trackBy: trackByUser"
      >
        <div class="d-flex align-items-center gap-3">
          <div class="user-avatar position-relative">
       
            <img
              *ngIf="user.image"
              [src]="user.image"
              alt="{{ user.name }}"
              class="rounded-circle border border-2 border-primary-subtle shadow-sm"
              width="48"
              height="48"
            />

            <div
              *ngIf="!user.image"
              class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold"
              style="width: 48px; height: 48px"
            >
              {{ getInitials(user.name) }}
            </div>
          </div>

          <div>
            <h6 class="mb-0 fw-semibold text-dark">{{ user.name }}</h6>
            <small class="text-muted d-block">{{ user.email }}</small>
            <small class="text-muted">
              <strong>{{ user.role }}</strong> •
              <span [ngClass]="{ 'text-success': user.status === 'Active', 'text-danger': user.status !== 'Active' }">
                {{ user.status }}
              </span>
            </small>
          </div>
        </div>

        <div class="text-end">
          <span class="badge bg-gradient bg-primary text-white mb-1">Top User</span><br />
          <small class="text-muted">
            Emails Sent: <strong>{{ user.totalEmailsSent }}</strong>
          </small>
        </div>
      </li>
    </ul>
  </div>
</div>
