<div class="card shadow-sm border-0">
  <div class="card-header bg-white d-flex justify-content-between align-items-center">
    <h5 class="mb-0 text-primary fw-bold">Top 5 Users</h5>
    <span class="badge bg-light text-muted">This Week</span>
  </div>

  <div class="card-body p-0">
    <ul class="list-group list-group-flush">
      <li class="list-group-item d-flex align-items-center justify-content-between"
        *ngFor="let user of top5Users; trackBy: trackByUser">
        <div class="d-flex align-items-center gap-3">
          <div class="user-avatar position-relative">
            <!-- If image exists, show it -->
            <img *ngIf="user.profileImage" [src]="user.profileImage" alt="{{ user.name }}"
              class="rounded-circle border border-2 border-primary-subtle shadow-sm" width="48" height="48" />

            <!-- If no image, show initials -->
            <div *ngIf="!user.profileImage"
              class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold"
              style="width: 48px; height: 48px;">
              {{ getInitials(user.name) }}
            </div>
          </div>


          <div>
            <h6 class="mb-1 fw-semibold text-dark">{{ user.name }}</h6>
            <small class="text-muted d-block">User ID: {{ user.userId }}</small>
          </div>
        </div>

        <div class="text-end">
          <span class="badge bg-gradient bg-primary text-white mb-1">Top User</span><br />
          <small class="text-muted">Emails Sent: <strong>{{ user.emailCount }}</strong></small>
        </div>
      </li>
    </ul>
  </div>
</div>
