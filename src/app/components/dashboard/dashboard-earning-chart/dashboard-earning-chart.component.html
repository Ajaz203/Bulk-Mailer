<div class="card border-0 shadow rounded-4">

  <div class="card-header  d-flex justify-content-between align-items-center px-4">
    <div class="card-header-title">
      <h5>Email Trend </h5>
    </div>
    <span class="text-muted small">Last Updated: {{ lastUpdated | date: 'short' }}</span>
  </div>

  <div class="card-body p-0">
    <div id="bar-chart-earning">
      <!-- Message -->
      <div class="position-relative" style="min-height: 300px;">
        <!-- No data message -->
        <div *ngIf="noDataAvailable" class="position-absolute top-50 start-50 translate-middle text-muted text-center">
          <strong>No data available for the last 7 months.</strong>
        </div>

        <!-- Chart -->
        <div *ngIf="dashboardEarningChart">
          <apx-chart [series]="dashboardEarningChart.series" [chart]="dashboardEarningChart.chart"
            [xaxis]="dashboardEarningChart.xaxis" [yaxis]="dashboardEarningChart.yaxis"
            [plotOptions]="dashboardEarningChart.plotOptions" [stroke]="dashboardEarningChart.stroke"
            [dataLabels]="dashboardEarningChart.dataLabels" [tooltip]="dashboardEarningChart.tooltip"
            [legend]="dashboardEarningChart.legend" [colors]="dashboardEarningChart.colors"
            [fill]="dashboardEarningChart.fill" [responsive]="dashboardEarningChart.responsive">
          </apx-chart>
        </div>
      </div>

    </div>
  </div>
</div>
