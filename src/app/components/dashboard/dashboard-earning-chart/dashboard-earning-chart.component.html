<div class="card border-0 shadow rounded-4">

  <div class="card-header  d-flex justify-content-between align-items-center px-4">
    <div class="card-header-title">
      <h5>Email Trend </h5> 
    </div>
    <span class="text-muted small">Last Updated: {{ lastUpdated | date: 'short' }}</span>
  </div>

  <div class="card-body p-0">
    <div id="bar-chart-earning">
      <apx-chart [series]="dashboardEarningChart.series" [colors]="dashboardEarningChart.colors"
        [chart]="dashboardEarningChart.chart" [plotOptions]="dashboardEarningChart.plotOptions"
        [dataLabels]="dashboardEarningChart.dataLabels" [stroke]="dashboardEarningChart.stroke"
        [xaxis]="dashboardEarningChart.xaxis" [yaxis]="dashboardEarningChart.yaxis"
        [legend]="dashboardEarningChart.legend" [fill]="dashboardEarningChart.fill"
        [responsive]="dashboardEarningChart.responsive">
      </apx-chart>
    </div>
  </div>
</div>
