<div class="card">
  <div class="d-flex align-items-center justify-content-between card-header">
    <div class="card-header-title">
      <h5>Email Traffic</h5>
    </div>
    <div class="btn-group" role="group">
      <button
        class="btn btn-outline-light txt-dark"
        [class.active]="selectedRange === 'day'"
        (click)="updateFilter('day')"
      >Day</button>
      <button
        class="btn btn-outline-light txt-dark"
        [class.active]="selectedRange === 'week'"
        (click)="updateFilter('week')"
      >Week</button>
      <button
        class="btn btn-outline-light txt-dark"
        [class.active]="selectedRange === 'month'"
        (click)="updateFilter('month')"
      >Month</button>
    </div>
  </div>
  <div class="card-body">
    <div id="traffic-chart">
      <ng-container *ngIf="hasChartData(); else noData">
        <apx-chart
          [series]="chartOptions.series"
          [chart]="chartOptions.chart"
          [stroke]="chartOptions.stroke"
          [markers]="chartOptions.markers"
          [colors]="chartOptions.colors"
          [dataLabels]="chartOptions.dataLabels"
          [grid]="chartOptions.grid"
          [fill]="chartOptions.fill"
          [legend]="chartOptions.legend"
          [xaxis]="chartOptions.xaxis"
          [responsive]="chartOptions.responsive"
        ></apx-chart>
      </ng-container>
      <ng-template #noData>
        <div class="text-center py-5">
          <p class="text-muted">No data available for this period.</p>
        </div>
      </ng-template>
    </div>
  </div>
</div>
