<div class="row">
  @for(data of topCommonData; track data){
  <div class="col-sm-6 col-xxl-3 col-lg-6">
    <app-top-common-data [data]="data"></app-top-common-data>
  </div>
  }
  <div class="col-xl-4">
    <app-dashboard-visitor-chart></app-dashboard-visitor-chart>
  </div>
  <div class="col-xl-8">
    <app-dashboard-earning-chart></app-dashboard-earning-chart>
  </div>
  <div class="col-xxl-8">
    <app-dashboard-booking-history></app-dashboard-booking-history>
  </div>
  <div class="col-lg-6 col-xxl-4">
    <div class="card">
      <div class="card-body">
        <div class="datepicker-dashboard">
        
          <ngb-datepicker [(ngModel)]="selectedDate" (ngModelChange)="onDateSelect($event)"></ngb-datepicker>

          <ng-template #customDay let-date let-currentMonth="currentMonth" let-selected="selected">
            <div class="custom-day" [class.today]="isToday(date)" [class.selected]="isSelected(date)">
              {{ date.day }}
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  </div>

  <div class="col-lg-6">
    <app-dashboard-traffic-chart [filter]="chartFilter"></app-dashboard-traffic-chart>
  </div>


</div>

<div *ngIf="planStatus === 'expiring'" class="alert alert-warning text-center">
  ⚠️ Your plan expires in {{ daysLeft }} days —
  <a (click)="renewPlan()" style="cursor:pointer; text-decoration: underline;">Renew Now</a>
</div>

<div *ngIf="planStatus === 'expired'" class="alert alert-danger text-center">
  ⛔ Your plan has expired —
  <a (click)="renewPlan()" style="cursor:pointer; text-decoration: underline;">Renew Now</a>
</div>
