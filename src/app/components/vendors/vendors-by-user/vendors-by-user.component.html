<div class="row">
  <div class="col-sm-12">
    <div class="card">
      <div class="card-header  card-header--2">
        <div>
          <h5>Vendor List by User - ({{ userVendorList.length || 0 }})</h5>
        </div>
      </div>
      <div class="card-body">
        <div class="table-responsive table-desi">
          <table class="user-table table table-striped">
            <thead>
              <tr>
                <th>User</th>
                <th>Name</th>
                <th>Email</th>
                <th>Uploaded Vendors</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let user of filteredUserList; let i = index" [routerLink]="['/vendors/list', user.userId]"
                [state]="{ user: user }" style="cursor: pointer;">
                <td>
                  <div class="rounded-circle text-white d-flex align-items-center justify-content-center fw-bold"
                    [ngClass]="getColor(i)" style="width: 48px; height: 48px">
                    {{ getInitials(user.name) }}
                  </div>
                </td>
                <td>{{ user.name || '-' }}</td>
                <td>{{ user.email || '-' }}</td>
                <td>{{ user.vendors?.length || 0 }}</td>
              </tr>

            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
