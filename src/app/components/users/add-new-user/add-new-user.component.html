<div class="row">
  <div class="col-12">
    <div class="row">
      <div class="col-sm-12">
        <div class="card">
          <div class="card-header">
            <h5>Add New User</h5>
          </div>
          <div class="card-body">
            <form class="theme-form mega-form" [formGroup]="userForm" (ngSubmit)="onSubmit()">
              <div class="mb-3">
                <label class="form-label-title">User Name</label>
                <input class="form-control" type="text" placeholder="User Name" formControlName="name"
                  [class.is-invalid]="userForm.get('name')?.invalid && userForm.get('name')?.touched">
                <div class="invalid-feedback" *ngIf="userForm.get('name')?.invalid && userForm.get('name')?.touched">
                  Please fill the name
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label-title">Email Address</label>
                <input class="form-control" type="email" placeholder="Email Address" formControlName="email"
                  [class.is-invalid]="userForm.get('email')?.invalid && userForm.get('email')?.touched">
                <div class="invalid-feedback" *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched">
                  Please enter a valid email address
                </div>
              </div>

              <div class="mb-3 position-relative">
                <label class="form-label-title">Password</label>

                <div class="input-group">
                  <input class="form-control" [type]="showPassword ? 'text' : 'password'" placeholder="Password"
                    formControlName="password"
                    [class.is-invalid]="userForm.get('password')?.invalid && userForm.get('password')?.touched" />
                  <button type="button" class="btn btn-outline-secondary" (click)="togglePassword()"
                    style="border: none; background: none;" tabindex="-1">
                    {{ showPassword ? '🙈' : '👁️' }}
                  </button>
                </div>

                <div class="invalid-feedback"
                  *ngIf="userForm.get('password')?.errors && userForm.get('password')?.touched">
                  <div *ngIf="userForm.get('password')?.errors?.['required']">Password is required</div>
                  <div *ngIf="userForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters
                  </div>
                  <div *ngIf="userForm.get('password')?.errors?.['pattern']">
                    Password must contain upper & lowercase letters, a number, and a special character
                  </div>
                </div>
              </div>


              <div class="card-footer text-end">
                <button class="btn btn-primary" type="submit" [disabled]="userForm.invalid || isLoading">
                  <span *ngIf="!isLoading">Submit</span>
                  <span *ngIf="isLoading">
                    <i class="spinner-border spinner-border-sm me-1"></i> Submitting...
                  </span>
                </button>

                <button class="btn btn-outline-primary ms-2" (click)="cancel()">Reset</button>
              </div>
            </form>
          </div>


        </div>
      </div>
    </div>
  </div>
</div>
