<div class="upload-section">
  <!-- Buttons or Tabs -->
  <div class="btn-group mb-4 ">
    <button class="btn btn-primary" [class.active]="activeTab === 'single'" (click)="activeTab = 'single'">
      Single Upload
    </button>
    <button class="btn btn-success" [class.active]="activeTab === 'bulk'" (click)="activeTab = 'bulk'">
      Bulk Upload
    </button>
  </div>
  <!-- Single Upload Form -->
  <div *ngIf="activeTab === 'single'" class="card p-4">
    <div class="card-header card--header">
      <h5>Single Candidate Upload</h5>
    </div>
    <form class="theme-form mega-form" #manualForm="ngForm" (ngSubmit)="save(manualForm)">
      <div class="row">
        <!-- Name -->
        <div class="mb-3 col-md-6">
          <label class="form-label-title">Name</label>
          <input class="form-control" type="text" [(ngModel)]="candidate.name" name="name" #name="ngModel"
            placeholder="Name" [class.is-invalid]="name.invalid && name.touched" />
          <div class="invalid-feedback" *ngIf="name.invalid && name.touched">
            Name is required
          </div>
        </div>
        <!-- Email -->
        <div class="mb-3 col-md-6">
          <label class="form-label-title">Email <span class="text-danger">*</span></label>
          <input class="form-control" type="email" [(ngModel)]="candidate.email" name="email" #email="ngModel" required
            placeholder="Email" [class.is-invalid]="email.invalid && email.touched" />
          <div class="invalid-feedback" *ngIf="email.invalid && email.touched">
            <div *ngIf="email.errors?.['required']">Email is required</div>
            <div *ngIf="email.errors?.['email']">Please enter a valid email address</div>
          </div>
        </div>
      </div>
      <div class="row">
        <!-- Contact No -->
        <div class="mb-3 col-md-6">
          <label class="form-label-title">Contact No</label>
          <input class="form-control" type="text" [(ngModel)]="candidate.contact_no" name="contactNo"
            #contactNo="ngModel" maxlength="15" placeholder="Contact No" (keypress)="allowOnlyNumbers($event)"
            (paste)="handlePaste($event)" [class.is-invalid]="contactNo.invalid && contactNo.touched" />
        </div>
        <!-- Work Status -->
        <div class="mb-3 col-md-6">
          <label class="form-label-title">Work Status</label>
          <select class="form-select" [(ngModel)]="candidate.visa" name="visa" #visa="ngModel"
            [class.is-invalid]="visa.invalid && visa.touched">
            <option value="" disabled selected hidden>Select work status</option>
            <option *ngFor="let visa of visaOptions" [value]="visa">{{ visa }}</option>
          </select>
        </div>
      </div>
      <div class="row">
        <!-- Location -->
        <div class="mb-3 col-md-6">
          <label class="form-label-title">Location</label>
          <input class="form-control" type="text" [(ngModel)]="candidate.location" name="location"
            placeholder="Location" />
        </div>
        <!-- Technology -->
        <div class="mb-3 col-md-6">
          <label class="form-label-title">Technology</label>
          <select class="form-select" [(ngModel)]="candidate.technology" name="technology" #category="ngModel"
            [class.is-invalid]="category.invalid && category.touched">
            <option value="" disabled selected hidden>Select a technology</option>
            <option value="NA">NA</option>
            <option *ngFor="let item of dropDownArr" [value]="item.name">{{ item.name }}</option>
          </select>
        </div>
      </div>
      <div class="row">
        <!-- Experience -->
        <div class="mb-3 col-md-6">
          <label class="form-label-title">Experience (in years)</label>
          <input class="form-control" type="number" [(ngModel)]="candidate.experience" name="experience"
            #experience="ngModel" min="0" max="50" placeholder="Years of Experience"
            [class.is-invalid]="experience.invalid && experience.touched" />
        </div>
        <!-- Skills -->
        <div class="mb-3 col-md-6">
          <label class="form-label-title">Add Skills</label>
          <div class="input-group mb-3">
            <input type="text" id="skillInput" class="form-control" placeholder="Add Skills" [(ngModel)]="skill"
              (keyup.enter)="addSkill()" name="skillInput" />
            <button class="btn btn-outline-success" type="button" (click)="addSkill()">+</button>
          </div>
          <div class="tag-container d-flex flex-wrap">
            <div *ngFor="let sk of skills; let i = index"
              class="badge bg-light m-1 px-3 py-2 rounded-pill d-flex align-items-center">
              {{ sk }}
              <span class="ms-2 text-success" style="cursor: pointer" (click)="removeSkill(i)">x</span>
            </div>
          </div>
        </div>
      </div>
      <!-- Actions -->
      <div class="card-footer text-end">
        <button class="btn btn-danger" type="button" (click)="reset(manualForm)">Reset</button>
        <button class="btn btn-success ms-2" type="submit" [disabled]="manualForm.invalid">Save</button>
      </div>
    </form>
  </div>
  <!-- Bulk Upload -->
  <div *ngIf="activeTab === 'bulk'" >
    <div class="bulk-upload-card">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="card-header">
          <!-- <h5>Single Candidate Upload</h5> -->
          <h5>Candidate Bulk Data Upload</h5>
        </div>
        <button class="btn btn-success" (click)="downloadMassTemplate()">
          <i class="bi bi-download"></i>
        </button>
      </div>
      <div class="upload-box" (click)="fileInput.click()" (dragover)="onDragOver($event)" (drop)="onDrop($event)">
        <div class="upload-box-content">
          <i class="bi bi-cloud-upload"></i><br />
          <p>
            <strong>Drag & drop files or
              <span class="browse-text" (click)="triggerFileUpload($event)">Browse</span>
            </strong>
          </p>
          <!-- <p><strong>Drag & drop files or <span class="browse-text">Browse</span></strong></p> -->
          <p class="format-text">Supported formats: Excel</p>
          <input type="file" #fileInput (change)="onFileChange($event)" accept=".xlsx, .xls" hidden />
        </div>
      </div>
      @if(fileName){
      <div class="input-group file-preview">
        <span class="form-control">{{ fileName }}</span>
        <span class="input-group-text text-success">
          &#10003;
        </span>
        <button class="btn btn-outline-secondary" type="button" (click)="removeFile()">
          <i class="bi bi-trash"></i>
        </button>
      </div>
      }
      @else{
      <div class="file-preview">
        <span>File details here.</span>
      </div>
      }
      <div class="action-buttons mb-2">
        <button class="btn btn-danger" (click)="removeFile()">Reset</button>
        <button class="btn btn-success" (click)="uploadFile()" [disabled]="!fileName || isUploading">
          <span *ngIf="isUploading" class="spinner-border spinner-border-sm me-2"></span>
          {{ isUploading ? 'Uploading...' : 'Upload File' }}
        </button>
      </div>
    </div>
  </div>
</div>
