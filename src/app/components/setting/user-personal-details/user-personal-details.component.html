<form class="theme-form mega-form card shadow-lg border-0 rounded-4 p-4" [formGroup]="profileForm"
  (ngSubmit)="submitForm()">
  <!-- Header -->
  <div class="card-header bg-transparent border-0 px-0 pb-3">
    <h5 class="fw-bold mb-1 ">Profile Details</h5>
    <p class="text-muted small mb-0">
      Manage your personal information, profile picture, and email signature
    </p>
  </div>

  <!-- Profile Image -->
  <div class="d-flex align-items-center gap-4 mb-4 flex-wrap">
    <div class="position-relative profile-img-wrapper">
      <img [src]="previewUrl || 'assets/images/users/4.jpg'" alt="Profile"
        class="rounded-circle border shadow-sm profile-img" />
      <label for="img" class="upload-overlay">
        <i class="bi bi-camera fs-4"></i>
      </label>
      <input type="file" id="img" (change)="onFileSelected($event)" accept="image/png, image/jpeg" hidden />
    </div>

    <div>
      <p class="text-muted small mb-2">
        <i class="bi bi-info-circle me-1"></i> Max size <b>5MB</b> | Min dimension <b>150x150</b> |
        Allowed: <b>.jpg, .png</b>
      </p>
      <button class="btn btn-outline-danger btn-sm rounded-pill d-flex align-items-center" type="button"
        (click)="removeImage()">
      Remove
      </button>
    </div>
  </div>

  <!-- Full Name -->
  <div class="mb-3">
    <label class="form-label fw-semibold">Full Name</label>
    <input class="form-control form-control-lg rounded-3" formControlName="userName" type="text"
      placeholder="Enter your full name" />
    <div *ngIf="profileForm.get('userName')?.invalid && profileForm.get('userName')?.touched"
      class="text-danger small mt-1">
      Full name is required
    </div>
  </div>
 <!-- Submit -->
  <div class="text-end">
    <button class="btn btn-primary px-4 shadow-sm rounded-pill" type="submit" [disabled]="!profileForm.valid">
     Save Changes
    </button>
  </div>
  <!-- Signature -->
  <div class="mb-3">
    <label class="form-label fw-semibold">Email Signature</label>
    <ngx-editor-menu [editor]="signatureEditor"></ngx-editor-menu>
    <ngx-editor [editor]="signatureEditor" formControlName="signature"
      placeholder="Create your professional signature..."
      class="signature-editor  bg-white"></ngx-editor>
    <small class="text-muted d-block mt-1">
      Include name, title, company, and contact. Supports <b>bold</b>, <i>italic</i>, links, and images.
    </small>

    <div class="text-end mt-3">
      <button type="button" class="btn btn-outline-success  rounded-pill " (click)="saveSignature()">
     Save Signature
      </button>
    </div>
  </div>

 
</form>
