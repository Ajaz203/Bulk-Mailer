<form class="theme-form mega-form" [formGroup]="profileForm" (ngSubmit)="submitForm()">
  <div class="personal-info">
    <div class="personal-info__img">
      <img [src]="previewUrl || 'assets/images/users/4.jpg'" alt="user4" style="width: 120px; height: 120px; border-radius: 50%;" />
    </div>

    <div class="personal-info__uplode">
      <p>Max file size is 5MB, Minimum dimension 150x150. Allowed: .jpg, .png</p>
      <div class="uplode-img">
        <input type="file" id="img" (change)="onFileSelected($event)" accept="image/png, image/jpeg" />
        <label for="img">
          <app-feather-icons [icon]="'upload'"></app-feather-icons>
          Upload Image here
        </label>
      </div>
      <button class="btn btn-danger mt-2" type="button" (click)="removeImage()">Remove image</button>
    </div>
  </div>

  <div class="row">
    <div class="col-sm-12">
      <label class="form-label-title mt-3">Full Name</label>
      <input class="form-control" formControlName="userName" type="text" placeholder="Enter Full Name" />
    </div>
  </div>

  <button class="btn btn-primary mt-4" type="submit" [disabled]="!profileForm.valid">Save Changes</button>
</form>
