<div class="row">
  <div class="col-12">
    <div class="row">
      <div class="col-sm-12">
        <div class="card">
          <div class="card-header">
            <h5>Add New Subscription Plan</h5>
          </div>

          <div class="card-body">
            <form [formGroup]="subscriptionForm" (ngSubmit)="onSubmit()" class="theme-form mega-form">

              <!-- Plan Name & Price -->
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label-title">Plan Name</label>
                  <input class="form-control" type="text" placeholder="Enter Plan Name" formControlName="name" />
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label-title">Price ($)</label>
                  <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input class="form-control" type="number" placeholder="e.g. 19.99" formControlName="price" />
                  </div>
                </div>
              </div>

              <!-- Daily Email Limit & Validity -->
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label-title">Daily Email Limit</label>
                  <input class="form-control" type="number" placeholder="e.g. 1000" formControlName="dailyMailLimit" />
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label-title">Validity (Days)</label>
                  <input class="form-control" type="number" placeholder="e.g. 30" formControlName="validity" />
                </div>
              </div>

              <!-- Max Users -->
              <div class="mb-3">
                <label class="form-label-title">Max Users Allowed</label>
                <input class="form-control" type="number" placeholder="Leave blank for unlimited" formControlName="maxUsers" />
              </div>

              <!-- Is Custom Toggle -->
              <div class="mb-3">
                <label class="form-label-title">Custom Plan?</label>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" formControlName="isCustom" />
                  <label class="form-check-label">Enable if this is a custom plan</label>
                </div>
              </div>
            </form>
          </div>

          <div class="card-footer text-end">
            <button class="btn btn-outline-primary me-3" type="button" (click)="onCancel()">Cancel</button>
            <button class="btn btn-primary " [disabled]="subscriptionForm.invalid" (click)="onSubmit()">Submit</button>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
