<div class="row">
  <div class="col-12">
    <div class="row">
      <div class="col-sm-12">
        <div class="card">
          <div class="card-header">
            <h5>Add New Subscription Plan</h5>
          </div>

          <div class="card-body">
            <form [formGroup]="subscriptionForm" (ngSubmit)="onSubmit()" class="theme-form mega-form">

              <!-- Plan Name & Price -->
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label-title">Plan Name</label>
                  <input class="form-control" type="text" placeholder="Enter Plan Name" formControlName="planName" />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label-title">Price ($)</label>
                  <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input class="form-control" type="number" placeholder="e.g. 19.99" formControlName="price" />
                  </div>
                </div>
              </div>

              <!-- Description -->
              <div class="mb-3">
                <label class="form-label-title">Plan Description</label>
                <textarea class="form-control" rows="3" placeholder="Enter Description" formControlName="description"></textarea>
              </div>

              <!-- Emails per Month & Duration -->
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label-title">Emails per Month</label>
                  <input class="form-control" type="number" placeholder="e.g. 10000" formControlName="emailLimit" />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label-title">Duration</label>
                  <select class="form-select" formControlName="duration">
                    <option value="" disabled>Select Duration</option>
                    <option value="monthly">Monthly</option>
                    <option value="quarterly">Quarterly</option>
                    <option value="yearly">Yearly</option>
                  </select>
                </div>
              </div>

              <!-- Admins & Users -->
              <div class="row">
              
                <div class="col-md-6 mb-3">
                  <label class="form-label-title">No. of Users per Admin</label>
                  <input class="form-control" type="number" placeholder="e.g. 5" formControlName="userLimit" />
                </div>
              </div>
            </form>
          </div>

          <div class="card-footer text-end">
            <button class="btn btn-primary me-3" [disabled]="subscriptionForm.invalid" (click)="onSubmit()">Submit</button>
            <button class="btn btn-outline-primary" type="button" (click)="onCancel()">Cancel</button>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
