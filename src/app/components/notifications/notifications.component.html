<div class="container py-5 notification-center">
  <!-- Header -->
  <div class="header d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4">
    <div>
      <h3 class="fw-bold mb-2 d-flex align-items-center gap-2">
        <i class="fa fa-bell text-primary"></i>
        {{ role === 'superadmin' ? 'Admin Notifications' : 'User Notifications' }}
      </h3>
      <p class="text-muted mb-0">Stay updated with recent activities and alerts.</p>
    </div>

    <div class="d-flex align-items-center gap-2 mt-3 mt-md-0">
      <button
        class="btn btn-outline-primary btn-sm px-4 rounded-pill d-flex align-items-center gap-2"
        (click)="markAllAsRead()"
        [disabled]="isAllRead()"
      >
        <i class="fa fa-check-circle"></i>  
        Mark All as Read
      </button>

      <!-- <a
        routerLink="/dashboard"
        class="btn btn-outline-primary btn-sm px-4 rounded-pill d-flex align-items-center gap-2"
      >
        <i class="fa fa-arrow-left"></i>
        Back to Dashboard
      </a> -->
    </div>
  </div>

  <!-- Filter Tabs -->
  <div class="filters mb-4">
    <ul class="nav nav-pills gap-2">
      <li class="nav-item">
        <button
          class="nav-link"
          [class.active]="selectedFilter === 'all'"
          (click)="selectedFilter = 'all'; filterNotifications()"
        >
          All
        </button>
      </li>
      <li class="nav-item">
        <button
          class="nav-link"
          [class.active]="selectedFilter === 'unread'"
          (click)="selectedFilter = 'unread'; filterNotifications()"
        >
          Unread
        </button>
      </li>
      <li class="nav-item">
        <button
          class="nav-link"
          [class.active]="selectedFilter === 'read'"
          (click)="selectedFilter = 'read'; filterNotifications()"
        >
          Read
        </button>
      </li>
    </ul>
  </div>

  <!-- Notification List -->
  <div *ngIf="filteredNotifications.length > 0; else emptyState" class="row g-3">
    <div *ngFor="let n of filteredNotifications" class="col-12 col-md-6 col-xl-4">
      <div
        class="notification-card shadow-sm rounded-4 p-4 h-100 position-relative overflow-hidden"
        [ngClass]="{
          'unread': n.status === 'unread',
          'read': n.status === 'read'
        }"
      >
        <div class="status-ribbon" [ngClass]="n.status">
          {{ n.status | titlecase }}
        </div>

        <div class="icon-wrapper mb-3">
          <i
            class="fa"
            [ngClass]="{
              'fa-envelope-open text-success': n.status === 'read',
              'fa-bell text-warning': n.status === 'unread'
            }"
          ></i>
        </div>

        <h5 class="fw-semibold mb-2">{{ n.title }}</h5>
        <p class="small  mb-3">{{ n.message }}</p>

        <div class="d-flex justify-content-between align-items-center small">
          <span>
            From: <strong>{{ n.senderName }}</strong>
          </span>
          <span >
            <i class="fa fa-clock me-1"></i>
            {{ n.createdAt | date: 'medium' }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <ng-template #emptyState>
    <div class="text-center py-5">
      <i class="fa fa-bell-slash fa-3x  mb-3"></i>
      <p class=" mb-0">You have no notifications at the moment.</p>
    </div>
  </ng-template>
</div>
