<div class="container py-5 notification-page">
  <!-- Header -->
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-5">
    <div class="mb-3 mb-md-0">
      <h3 class="fw-bold text-gradient d-flex align-items-center gap-2">
        <i class="fa fa-bell text-warning"></i>
        {{ role === 'superadmin' ? 'Admin Notifications' : 'User Notifications' }}
      </h3>
      <p class="small text-muted mb-0">
        Stay informed with your latest updates and system alerts.
      </p>
    </div>
    <a routerLink="/dashboard" class="btn btn-outline-primary btn-sm px-4 shadow-sm rounded-pill d-flex align-items-center gap-2">
      <i class="fa fa-arrow-left"></i> Back to Dashboard
    </a>
  </div>

  <!-- Timeline -->
  <div class="timeline position-relative">
    <div class="timeline-line position-absolute start-3 top-0 h-100"></div>

    <div *ngFor="let n of notifications" class="timeline-item d-flex align-items-start gap-3 position-relative">
      <!-- Icon -->
      <div class="timeline-icon d-flex align-items-center justify-content-center rounded-circle shadow-sm"
           [ngClass]="{
             'bg-success text-white': n.status === 'read',
             'bg-warning text-dark': n.status === 'unread'
           }">
        <i class="fa" [ngClass]="{
          'fa-check-circle': n.status === 'read',
          'fa-bell': n.status === 'unread'
        }"></i>
      </div>

      <!-- Card -->
      <div class="card shadow-sm border rounded-3 p-3 transition-hover w-100"
           [ngClass]="{
             'border-warning bg-warning-subtle': n.status === 'unread',
             'border-success bg-success-subtle': n.status === 'read'
           }">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <h5 class="fw-bold mb-1">{{ n.title }}</h5>
          <small class="text-muted">{{ n.createdAt | date: 'medium' }}</small>
        </div>
        <p class="mb-2">{{ n.message }}</p>
        <div class="d-flex justify-content-between align-items-center">
          <span class="badge rounded-pill"
                [ngClass]="n.status === 'unread' ? 'bg-warning-subtle text-dark' : 'bg-success-subtle text-success'">
            {{ n.status | titlecase }}
          </span>
          <span class="text-muted fst-italic">From: {{ n.senderName }}</span>
        </div>
      </div>
    </div>

    <!-- No notifications -->
    <div *ngIf="notifications.length === 0" class="text-center py-5 w-100">
      <i class="fa fa-bell-slash fa-3x mb-3 text-secondary"></i>
      <p class="mb-0 text-muted">No notifications available</p>
    </div>
  </div>
</div>
