<header class="navbar">
  <div class="container">
    <!-- Logo -->
    <!-- <div class="logo">
      <a routerLink="/">Mailcept</a>
    </div> -->
  <div class="logo" routerLink="/dashboard">
      <img src="/asset/Mailcept Logo-01.jpg" alt="Logo" class="me-2 idmx-logo" height="50" width="100">
    </div>
    <!-- Toggle Button (visible on mobile) -->
    <div class="menu-toggle" (click)="toggleMobileMenu()">
      &#9776;
    </div>

    <!-- Navigation Menu -->
    <nav class="menu" [ngClass]="{ 'active': isMobileMenuActive }">
      <ul class="nav-list">
        <li>
          <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
        </li>
        <li>
          <a routerLink="/about-us" routerLinkActive="active">About Us</a>
        </li>
        <li>
          <a routerLink="/packages" routerLinkActive="active">Package</a>
        </li>
        <li>
          <a routerLink="/contact-us" routerLinkActive="active">Contact Us</a>
        </li>
        <li>
          <button class="btn btn-success login-btn" routerLink="/login" routerLinkActive="active">Login</button>
        </li>
      </ul>
    </nav>
  </div>
</header>
