<app-header></app-header>
<div class="container-fluid mt-3">
  <h4 class="mb-2" style="margin-left: 20px;">Bulk Emails</h4>

  <!-- Tabs -->
  <ul class="nav nav-tabs" id="emailTab" role="tablist">
    <li class="nav-item dropdown" (mouseenter)="openDropdown = true" (mouseleave)="openDropdown = false"
      [class.show]="openDropdown">

      <!-- Dropdown Toggle -->
      <a class="nav-link dropdown-toggle" href="javascript:void(0)" [class.active]="segment === 'candidate'"
        (click)="segment = 'candidate'">
        Candidate
      </a>

      <!-- Dropdown Menu -->
      <ul class="dropdown-menu" [class.show]="openDropdown">

        <li>
          <a class="dropdown-item" (click)="dropdown()">
            Candidate List
          </a>
        </li>
      </ul>
    </li>


    <li class="nav-item" role="presentation">
      <button class="nav-link" [class.active]="segment === 'vendor'" id="vendor-tab" data-bs-toggle="tab"
        data-bs-target="#vendor" type="button" role="tab" (click)="segment = 'vendor'">
        Vendor
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" [class.active]="segment === 'viewData'" id="vendor-tab" data-bs-toggle="tab"
        data-bs-target="#vendor" type="button" role="tab" (click)="segment = 'viewData'">
        View Category
      </button>
    </li>

  </ul>
  <div *ngIf="segment === 'candidate'">
  
    <div class="upload-grid">
      <app-single-upload></app-single-upload>
      <app-bulk-upload (dataParsed)="onExcelDataReceived($event)"></app-bulk-upload>

    </div>

    <!-- Candidate list: full width below -->
    <!-- <div class="candidate-list-wrapper">
      <app-candidate-list ></app-candidate-list>
    </div> -->
  </div>

  <div *ngIf="segment === 'vendor'">

    <app-vendor-bulk-upload (dataParsed)="onExcelDataReceived($event)"></app-vendor-bulk-upload>
  </div>
  <div *ngIf="segment === 'viewData'">
    <app-cat-table></app-cat-table>

  </div>
</div>
