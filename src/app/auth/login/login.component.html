<div class="container-fluid p-0">
  <div class="row m-0">
    <div class="col-12 p-0">
      <div class="login-card">
        <div>
          <!-- <div><a class="logo" href="javascript:void(0)" [routerLink]="['/dashboard']">
              <img class="img-fluid for-light" src="assets/images/logo/mailcept.png" alt="looginpage">
              <img class="img-fluid for-dark" src="assets/images/logo/mailcept.png" alt="looginpage">
            </a>
          </div> -->
          <div class="login-main">
            <form class="theme-form" [formGroup]="loginForm">
              <h4>Sign in to account</h4>
              <p>Enter your email & password to login</p>

              <div class="form-group">
                <label class="col-form-label form-label-title">Email Address</label>
                <input class="form-control" type="email" placeholder="Email Address" formControlName="email" />
                <div *ngIf="email.touched && email.errors" class="text text-danger mt-1">
                  <div *ngIf="email.errors['required']">Email is required</div>
                  <div *ngIf="email.errors['email']">Invalid Email</div>
                </div>
              </div>

              <div class="form-group">
                <label class="col-form-label form-label-title">Password</label>
                <div class="form-input position-relative">
                  <input class="form-control" [type]="show ? 'text' : 'password'"
                    formControlName="password" placeholder="Password"/>
                  <div class="show-hide" (click)="showPassword()">
                    <span [class.show]="show"> </span>
                  </div>
                </div>
                <div *ngIf="password.touched && password.errors" class="text text-danger mt-1">
                  <div *ngIf="password.errors['required']">Password is required</div>
                </div>
              </div>

              <div class="form-group mb-0">
                <!-- <div class="checkbox p-0">
                  <input id="checkbox1" type="checkbox" />
                  <label class="text-muted" for="checkbox1">Remember password</label>
                </div>
                <a class="link" href="javascript:void(0)">Forgot password?</a> -->

                <div class="text-end mt-3">
                  <button #loginBtn class="btn btn-gradient btn-block w-100" type="button" [disabled]="loginForm.invalid"
                    (click)="login(loginBtn)">
                    Sign in
                  </button>

                </div>
              </div>

             

              <!-- <p class="mt-4 mb-0 text-center">
                Don't have an account?
                <a class="ms-2" [routerLink]="['/register']">Create Account</a>
              </p> -->
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

</div>
