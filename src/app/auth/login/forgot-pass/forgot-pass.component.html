<div
  class="forgot-wrapper d-flex align-items-center justify-content-center"
  style="background: url('/assets/images/bulkemail.png') center center / cover no-repeat; min-height: 100vh;"
>
  <div
    class="forgot-container glass-card p-4 p-md-5 d-flex flex-column flex-md-row gap-4 align-items-center shadow-lg rounded-4"
    style="max-width: 800px;"
  >
    <!-- Image (optional) -->
    <!-- <div class="d-none d-md-block">
      <img src="asset/Forgot password-bro.png" alt="Illustration" class="img-fluid" style="max-width: 250px;" />
    </div> -->

    <!-- Form Section -->
    <div style="min-width: 280px; width: 100%; max-width: 380px;">
      <h3 class="mb-3">
        {{ isResetPasswordStep ? 'Reset Password' : (isOtpStep ? 'Enter OTP' : 'Verify Your Identity') }}
      </h3>

      <p class="mb-4" *ngIf="!isOtpStep && !isResetPasswordStep">
        To verify your email address, enter your email and accept the terms to proceed.
      </p>

      <p class="mb-4 " *ngIf="isOtpStep && !isResetPasswordStep">
        Enter the 6-digit OTP sent to <strong>{{ email }}</strong>
      </p>

      <p class="mb-4 " *ngIf="isResetPasswordStep">
        Set a new password for <strong>{{ email }}</strong>
      </p>

      <form class="theme-form" (ngSubmit)="onSubmit()">
        <!-- Email Step -->
        <div *ngIf="!isOtpStep && !isResetPasswordStep">
          <div class="mb-3">
            <label class="col-form-label form-label-title">Email</label>
            <input
              type="email"
              class="form-control"
              placeholder="Enter your email"
              [(ngModel)]="email"
              name="email"
              required
            />
          </div>
          <div class="form-check mb-3">
            <input
              class="form-check-input"
              type="checkbox"
              id="terms"
              [(ngModel)]="acceptTerms"
              name="terms"
            />
            <label class="form-check-label " for="terms">
              I accept the <a href="#" class="text-secondary text-decoration-underline">Terms & Conditions</a>
            </label>
          </div>
        </div>

        <!-- OTP Step -->
        <div *ngIf="isOtpStep && !isResetPasswordStep">
          <div class="mb-3">
            <label class="form-label ">OTP</label>
            <input
              type="text"
              class="form-control"
              maxlength="6"
              placeholder="Enter 6-digit OTP"
              [(ngModel)]="otp"
              name="otp"
              required
            />
          </div>
        </div>

        <!-- Reset Password Step -->
        <div *ngIf="isResetPasswordStep">
          <div class="mb-3 position-relative">
            <label class="form-label ">New Password</label>
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-control pe-5"
              placeholder="Enter new password"
              [(ngModel)]="newPassword"
              name="newPassword"
              required
            />
            <span
              class="position-absolute"
              style="top: 75%; right: 1rem; transform: translateY(-50%); cursor: pointer;"
              (click)="togglePassword()"
            >
              <i class="bi text-black" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </span>
          </div>
        </div>

        <!-- Actions -->
        <div class="d-flex justify-content-between mt-3">
          <a routerLink="/auth/login" class="btn btn-outline-info me-3">
            <i class="bi bi-arrow-left"></i> Back to Login
          </a>
          <button type="submit" class="btn btn-primary" [disabled]="loading">
            {{ isResetPasswordStep ? 'Update Password' : (isOtpStep ? 'Verify OTP' : 'Send Code') }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Loader -->
<div *ngIf="loading" class="loader-overlay">
  <div class="spinner-border text-light" role="status"></div>
</div>
