<div class="container py-4" style="max-width: 1200px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-semibold text-dark mb-0">
      👋 Welcome, <span class="text-primary">{{ userName }}</span>
    </h2>
    <!-- <span class="badge bg-light text-dark border px-3 py-2 shadow-sm">Dashboard</span> -->
  </div>
  <div class="row row-cols-2 row-cols-md-3 row-cols-xl-5 g-4 mb-4">
    <div class="col" *ngFor="let stat of overviewStats">
      <div class="card h-100 border-1 shadow-sm rounded-4">
        <div class="card-body text-center py-3">
          <div class="mb-2 text-secondary">
            <i class="bi fs-4" [ngClass]="stat.icon"></i>
          </div>
          <div class="fw-medium text-muted small text-uppercase">{{ stat.label }}</div>
          <div class="fs-4 fw-bold text-dark">{{ stat.count }}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4 mb-4">
    <div class="col-lg-8">
      <div class="card border-1 shadow-sm rounded-4">
        <div class="card-body">
          <h5 class="fw-semibold mb-3">📈 Email Trend (Last 7 Days)</h5>
          <div *ngIf="isBrowser">
            <canvas baseChart [data]="emailTrendData" [labels]="emailTrendLabels" [options]="lineChartOptions"
              [type]="'line'" height="250">
            </canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card border-1 shadow-sm rounded-4 h-100">
        <div class="card-body d-flex flex-column align-items-center justify-content-center text-center">
          <h5 class="fw-semibold mb-3 text-dark">📊 Email Type Distribution</h5>
          <div *ngIf="isBrowser" style="width: 100%; max-width: 220px;">
            <canvas baseChart [data]="emailTypeData" [labels]="emailTypeLabels" [type]="'pie'"
              [options]="pieChartOptions" height="220">
            </canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
