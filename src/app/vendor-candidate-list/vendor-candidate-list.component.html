<div class="container" style="max-width: 1200px;">
  <div class="list-wrapper">
    <div class="d-flex justify-content-between align-items-center flex-wrap w-100 mb-2">
      <div class="d-flex align-items-center">
        <strong>Vendor Bulk List - ({{ userVendorList.length || 0 }})</strong>

      </div>

      <div class="action-buttons ">
        <button class="btn btn-outline-secondary me-2" (click)="handleSelectCandidateSend()">
          <i class="bi bi-send"></i> Select Candidate Send
        </button>

        <button class="btn btn-success" (click)="handleAllCandidateSend()">
          <i class="bi bi-send"></i> All Candidate Send
        </button>
      </div>

    </div>
    <div class="d-flex align-items-center gap-2 position-relative mb-2">
      <input type="text" class="form-control ps-4 pe-5 rounded-pill" placeholder="Search by subject or email..."
        [(ngModel)]="searchTerm" />
      <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-2 text-muted"></i>

      <button *ngIf="searchTerm" class="btn position-absolute top-50 end-0 translate-middle-y me-2 p-0 border-0"
        (click)="searchTerm = ''" style="background: transparent;">
        <i class="bi bi-x-circle-fill text-muted"></i>
      </button>
    </div>
    <div class="table-container" style="max-height: 400px; overflow-y: auto;">
      <table class="table table-bordered table-striped">
        <thead class="table-primary">
          <tr>
            <th>S.No</th>
            <th>Name</th>
            <th>Email</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of userVendorList; let i = index" (click)="openUserVendors(user)"
            style="cursor: pointer;">
            <td>{{ i + 1 }}</td>
            <td>{{ user.name || '-' }}</td>
            <td>{{ user.email || '-' }}</td>
          </tr>

          <tr *ngIf="userVendorList.length === 0">
            <td colspan="3" class="text-center text-muted py-3">No users found.</td>
          </tr>
        </tbody>
      </table>

    </div>

  </div>
</div>


<div
  class="modal fade"
  id="vendorModal"
  tabindex="-1"
  aria-labelledby="vendorModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-semibold" id="vendorModalLabel">
          Vendor List - {{ selectedUser?.name || '-' }}
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>

      <div class="modal-body">
        <table class="table table-bordered table-striped">
          <thead class="table-primary">
            <tr>
              <th>S.No</th>
              <th>Email</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let vendor of vendorList; let i = index">
              <td>{{ i + 1 }}</td>
              <td>{{ vendor.email }}</td>
              <td class="d-flex align-items-center justify-content-center gap-2">
                <i
                  class="bi bi-pencil-square text-dark fs-5"
                  (click)="editCandidate(vendor)"
                  title="Edit"
                ></i>
                <i
                  class="bi bi-trash3 text-danger fs-5"
                  (click)="deleteCandidate(vendor.id)"
                  title="Delete"
                ></i>
              </td>
            </tr>

            <tr *ngIf="vendorList.length === 0">
              <td colspan="3" class="text-center text-muted py-3">
                No vendors found.
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">
          Close
        </button>
      </div>
    </div>
  </div>
</div>




<!-- mail template model -->

<div class="modal fade" id="mailModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title">Send Mail</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <div class="d-flex align-items-center gap-3 flex-nowrap mb-3">

          <!-- Scheduler -->
          <div class="d-flex align-items-center gap-2">
            <label class="fw-medium mb-0" style="white-space: nowrap;">Schedule:</label>

            <input type="date" class="form-control form-control-sm" [(ngModel)]="scheduleDate"
              style="max-width: 160px;" />

            <input type="time" class="form-control form-control-sm" [(ngModel)]="scheduleTime"
              style="max-width: 120px;" />

          </div>

        </div>
        <!-- Subject -->
        <div class="mb-3">
          <label class="form-label fw-medium">Subject</label>
          <input type="text" class="form-control" [(ngModel)]="mailSubject" placeholder="Enter subject..." />
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label class="form-label fw-medium">Description</label>
          <textarea class="form-control" rows="5" [(ngModel)]="mailBody"
            placeholder="Enter your mail content..."></textarea>
        </div>

        <!-- Footer -->
        <div class="modal-footer">
          <button class="btn btn-secondary" (click)="saveAsDraft()">Save as Draft</button>
          <button class="btn btn-success" (click)="vendorSendMail()">Send</button>
        </div>

      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Edit Vendor</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">


        <div class="mb-3">
          <label class="fw-bold">Email:</label>
          <input [(ngModel)]="selectedCandidate.email" class="form-control" />
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" class="btn btn-success" (click)="updateCandidate()">
          Save Changes
        </button>
      </div>

    </div>
  </div>
</div>

<!-- loader -->
<div *ngIf="isLoading" class="loader-backdrop">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>
