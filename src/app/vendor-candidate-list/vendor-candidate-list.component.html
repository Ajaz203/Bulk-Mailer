<div class="container" style="max-width: 1200px;">
  <div class="list-wrapper">
    <div class="d-flex justify-content-between align-items-center flex-wrap w-100 mb-2">

      <!-- Left: Heading -->
      <div class="d-flex align-items-center">
        <strong>Vendor Bulk List - ({{ dataArr?.length || 0 }})</strong>

      </div>

      <div class="action-buttons ">
        <button class="btn btn-outline-secondary me-2" (click)="handleSelectCandidateSend()">
          <i class="bi bi-send"></i> Select Candidate Send
        </button>

        <button class="btn btn-success" (click)="handleAllCandidateSend()">
          <i class="bi bi-send"></i> All Candidate Send
        </button>
      </div>

    </div>
    <div class="d-flex align-items-center gap-2 position-relative mb-2">
      <input type="text" class="form-control ps-4 pe-5 rounded-pill" placeholder="Search by subject or email..."
        [(ngModel)]="searchTerm" />

      <!-- Search Icon (optional) -->
      <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-2 text-muted"></i>

      <!-- Clear Button -->
      <button *ngIf="searchTerm" class="btn position-absolute top-50 end-0 translate-middle-y me-2 p-0 border-0"
        (click)="searchTerm = ''" style="background: transparent;">
        <i class="bi bi-x-circle-fill text-muted"></i>
      </button>
    </div>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>
            <input type="checkbox" (change)="toggleSelectAll($event)" [checked]="isAllSelected()" />
          </th>
          <th>S.No</th>
          <th>Email</th>
          <!-- <th>Created At</th> -->
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of filteredData(); let i = index">
          <td>
            <input type="checkbox" [checked]="selectedCandidates.has(c)" (change)="toggleSelection(c)" />
          </td>
          <td>{{ i + 1 }}</td>
          <td>{{ c.email }}</td>
          <td class="d-flex align-items-center justify-content-center gap-3">
            <i class="bi bi-pencil-square text-dark fs-5" (click)="editCandidate(c)" title="Edit"></i>
            <i class="bi bi-trash3 text-danger fs-5" (click)="deleteCandidate(c.id)" title="Delete"></i>
          </td>
        </tr>
        <tr *ngIf="filteredData().length === 0">
          <td colspan="12" class="text-center text-muted py-4">
            <i class="bi bi-building-x fs-4 me-2"></i> No Vendors Found
          </td>
        </tr>

      </tbody>

    </table>
  </div>
</div>




<!-- mail template model -->

<div class="modal fade" id="mailModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title">Send Mail</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <div class="d-flex align-items-center gap-3 flex-nowrap mb-3">

          <!-- Scheduler -->
          <div class="d-flex align-items-center gap-2">
            <label class="fw-medium mb-0" style="white-space: nowrap;">Schedule:</label>

            <input type="date" class="form-control form-control-sm" [(ngModel)]="scheduleDate"
              style="max-width: 160px;" />

            <input type="time" class="form-control form-control-sm" [(ngModel)]="scheduleTime"
              style="max-width: 120px;" />

          </div>

        </div>
        <!-- Subject -->
        <div class="mb-3">
          <label class="form-label fw-medium">Subject</label>
          <input type="text" class="form-control" [(ngModel)]="mailSubject" placeholder="Enter subject..." />
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label class="form-label fw-medium">Description</label>
          <textarea class="form-control" rows="5" [(ngModel)]="mailBody"
            placeholder="Enter your mail content..."></textarea>
        </div>

        <!-- Footer -->
        <div class="modal-footer">
          <button class="btn btn-secondary" (click)="saveAsDraft()">Save as Draft</button>
          <button class="btn btn-success" (click)="vendorSendMail()">Send</button>
        </div>

      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Edit Vendor</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">


        <div class="mb-3">
          <label class="fw-bold">Email:</label>
          <input [(ngModel)]="selectedCandidate.email" class="form-control" />
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" class="btn btn-success" (click)="updateCandidate()">
          Save Changes
        </button>
      </div>

    </div>
  </div>
</div>

<!-- loader -->
<div *ngIf="isLoading" class="loader-backdrop">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>
