<div class="drafts-container mt-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">📑 Saved Drafts</h4>
    <button class="btn btn-success" (click)="refreshDrafts()">
      <i class="bi bi-arrow-clockwise"></i> Refresh
    </button>
  </div>

  <div class="btn-group mb-3">
    <input type="radio" class="btn-check" name="options" id="candidateBtn" autocomplete="off"
      [checked]="targetType === 'candidate'" (change)="switchTargetType('candidate')">
    <label class="btn btn-outline-primary" for="candidateBtn">
      Candidate
    </label>

    <input type="radio" class="btn-check" name="options" id="vendorBtn" autocomplete="off"
      [checked]="targetType === 'vendor'" (change)="switchTargetType('vendor')">
    <label class="btn btn-outline-warning" for="vendorBtn">
      Vendor
    </label>
  </div>



  <div class="table-responsive">
    <table class="table custom-table">
      <thead>
        <tr>
          <th>S.No</th>
          <th>Subject</th>
          <th>Emails</th>
          <th>Description</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let draft of draftList; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ draft.mailSubject || 'No Subject' }}</td>
          <td>
            <div class="text-truncate" style="max-width: 250px;" [title]="draft.emails?.join(', ')">
              {{ draft.emails?.join(', ') }}
            </div>
          </td>
          <td>
            <div class="text-truncate" style="max-width: 300px;" [title]="draft.mailBody">
              {{ draft.mailBody || 'No Body Content' }}
            </div>
          </td>
          <td>
            <i class="bi bi-pencil-square text-dark me-3" (click)="editDraft(draft)" title="Edit Draft"></i>
            <i class="bi bi-trash3 text-danger" (click)="deleteDraft(draft)" title="Delete Draft"></i>
          </td>
        </tr>
        <tr *ngIf="draftList.length === 0">
          <td colspan="5" class="text-center text-muted py-3">
            <i class="bi bi-inbox"></i> No Drafts Found
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>



<!-- Modal -->
<div class="modal fade" id="mailModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          {{ editingDraftId ? 'Edit Draft' : 'Send Mail' }} - {{ targetType | titlecase }}
        </h5>

        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">

        <div class="d-flex align-items-center gap-2 mb-3">
          <label class="fw-medium mb-0" style="white-space: nowrap;">Schedule:</label>
          <input type="date" class="form-control form-control-sm" [(ngModel)]="scheduleDate"
            style="max-width: 160px;" />
          <input type="time" class="form-control form-control-sm" [(ngModel)]="scheduleTime"
            style="max-width: 120px;" />
        </div>

        <div class="mb-3">
          <label class="form-label fw-medium">Subject</label>
          <input type="text" class="form-control" [(ngModel)]="mailSubject" placeholder="Enter subject..." />
        </div>

        <div class="mb-3">
          <label class="form-label fw-medium">Description</label>
          <textarea class="form-control" rows="5" [(ngModel)]="mailBody"
            placeholder="Enter your mail content..."></textarea>
        </div>

      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="saveAsDraft()">
          <i class="bi bi-save"></i> Save as Draft
        </button>
        <button class="btn btn-success" (click)="sendMail()">
          <i class="bi bi-send"></i> Send
        </button>
      </div>
    </div>
  </div>
</div>
