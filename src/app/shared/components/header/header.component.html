<div class="header-wrapper row m-0">
  <div class="header-logo-wrapper col-auto p-0">
    <div class="logo-wrapper" routerLink="/dashboard">
        <img class="img-fluid main-logo" src="assets/images/Asset 6.png" alt="logo">
        <img class="img-fluid white-logo" src="assets/images/Asset 6.png" alt="logo">
    </div>
    <div class="toggle-sidebar" (click)="toggleSidebar()">
      <app-feather-icons [icon]="'align-center'" [class]="'status_toggle middle sidebar-toggle'"></app-feather-icons>
    </div>
  </div>


  <div class="nav-right col-4 pull-right right-header p-0">
    <ul class="nav-menus">

      <li class="mt-2">
        <app-theme-mode></app-theme-mode>
      </li>

      <li class="maximize">
        <app-full-screen></app-full-screen>
      </li>
      <li class="profile-nav onhover-dropdown pe-0 me-0">
        <app-user-profile></app-user-profile>
      </li>
    </ul>
  </div>
</div>
