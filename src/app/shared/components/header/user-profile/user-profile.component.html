<div class="media profile-media" (click)="toggle()">
  <img class="user-profile rounded-circle" src="https://cdn-icons-png.flaticon.com/512/9131/9131529.png" alt="profile-picture">
  <div class="user-name-hide media-body"><span>{{ userName }}</span>
    <p class="mb-0 font-roboto">{{ userEmail }} <i class="middle fa fa-angle-down"></i></p>
  </div>
</div>
<ul class="profile-dropdown onhover-show-div" [class.active]="isActive">
  <li><a href="javascript:void(0)">
    <app-feather-icons [icon]="'user'"></app-feather-icons>
    <span>Account </span></a></li>
  <li><a href="javascript:void(0)"><app-feather-icons [icon]="'mail'"></app-feather-icons><span>Inbox</span></a></li>
  <li><a href="javascript:void(0)"><app-feather-icons [icon]="'file-text'"></app-feather-icons><span>Taskboard</span></a></li>
  <li><a href="javascript:void(0)" (click)="openSettings()"><app-feather-icons [icon]="'settings'"></app-feather-icons><span>Settings</span></a></li>
  <li><a href="javascript:void(0)" (click)="logout()"><app-feather-icons [icon]="'log-out'"></app-feather-icons><span>Log out</span></a></li>

</ul>
