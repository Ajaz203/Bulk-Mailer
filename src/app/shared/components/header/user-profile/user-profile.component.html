<div class="media profile-media" (click)="toggle()">
  <ng-container *ngIf="user$ | async as user">
    <img
     [src]="getImageUrl(user.profilePicture || user.profileImage)"

      (error)="onImageError($event)"
      alt="Profile"
      class="avatar-img rounded-circle"
      height="40"
      width="40"
    />

    <div class="user-name-hide media-body">
      <span>{{ user.name }}</span>
      <p class="mb-0 font-roboto fw-bold">{{ user.role }}</p>
    </div>
  </ng-container>
</div>

<ul class="profile-dropdown onhover-show-div" [class.active]="isActive">
  <li>
    <a href="javascript:void(0)" (click)="goToAccount()">
      <app-feather-icons [icon]="'user'"></app-feather-icons>
      <span>Account</span>
    </a>
  </li>
  <li>
    <a href="javascript:void(0)" (click)="logout()">
      <app-feather-icons [icon]="'log-out'"></app-feather-icons>
      <span>Log out</span>
    </a>
  </li>
</ul>
