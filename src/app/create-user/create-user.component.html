<div class="main_wrapper d-flex align-items-center justify-content-center vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5 right-section">
        <div class="login-sec p-4 shadow rounded">
          <h2 class="text-center mb-4">Register</h2>
          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input
                type="text"
                class="form-control"
                placeholder="Enter your name"
                [(ngModel)]="name"
                name="name"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                placeholder="Enter your email"
                [(ngModel)]="email"
                name="email"
                required
              />
            </div>

            <div class="mb-3 position-relative">
              <label class="form-label">Password</label>
              <input
                [type]="showPassword ? 'text' : 'password'"
                class="form-control"
                placeholder="Enter your password"
                [(ngModel)]="password"
                name="password"
                required
              />
              <span
                class="position-absolute end-0 top-50 translate-middle-y me-3"
                style="cursor: pointer"
                (click)="togglePassword()"
              >
                <i class="bi" [ngClass]="showPassword ? 'bi-eye' : 'bi-eye-slash'"></i>
              </span>
            </div>

            <div class="d-flex justify-content-start gap-3 mt-4">
              <a routerLink="/" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back
              </a>

              <button type="submit" class="btn btn-success" [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                Submit
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
