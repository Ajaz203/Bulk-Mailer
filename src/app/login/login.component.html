<div class="main_wrapper d-flex align-items-center justify-content-center vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="login-sec p-4 shadow rounded">
          <h2 class="mb-3">Login</h2>

          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                placeholder="Enter your email"
                [(ngModel)]="email"
                name="email"
                required
              />
            </div>

            <div class="mb-3 position-relative">
              <label class="form-label">Password</label>
              <input
                [type]="showPassword ? 'text' : 'password'"
                class="form-control"
                placeholder="Enter your password"
                [(ngModel)]="password"
                name="password"
                required
              />
              <span
                class="position-absolute end-0 top-50 translate-middle-y me-3"
                style="cursor: pointer;"
                (click)="togglePassword()"
              >
                <i class="bi" [ngClass]="showPassword ? 'bi-eye' : 'bi-eye-slash'"></i>
              </span>
            </div>

            <div class="d-flex justify-content-between mb-3">
              <a routerLink="/forgot-password" class="btn btn-outline-secondary w-50 me-2">
                Can't access your account?
              </a>
              <a routerLink="/sign-up" class="btn btn-outline-secondary w-50">
                Create New Account
              </a>
            </div>

            <button type="submit" class="btn btn-success w-100">
              {{ loading ? 'Please wait...' : 'Submit' }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 🔥 Loader -->
<div *ngIf="loading" class="loader-overlay">
  <div class="spinner-border text-light" role="status"></div>
</div>
