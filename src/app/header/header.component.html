<div class="page-container mt-2">

  <div class="app-header d-flex justify-content-between align-items-center p-3 px-2 shadow-sm bg-white rounded-bottom">
    <div class="d-flex align-items-center gap-2">

      <h4 class="mb-0 fw-bold" style="color: #5ab745;">
        SwiftSend <small class="text-muted fw-normal">by McKinsol</small>

      </h4>
    </div>

    <div class="text-end">
      <span class="badge bg-gradient-primary text-light fw-medium">Secure Mail Platform</span>
    </div>
  </div>



  <ul class="nav nav-tabs">
    <li class="nav-item dropdown" (mouseenter)="openDropdown = true" (mouseleave)="openDropdown = false"
      [class.show]="openDropdown">
      <a class="nav-link dropdown-toggle" routerLink="/" [class.active]="segment === ''" (click)="segment = ''">
        Candidate
      </a>
      <ul class="dropdown-menu" [class.show]="openDropdown">
        <li>
          <a class="dropdown-item" (click)="gotToCanidateList(); segment = ''">
            Candidate List
          </a>
        </li>
      </ul>
    </li>

    <li class="nav-item dropdown" (mouseenter)="openDropdownVendor = true" (mouseleave)="openDropdownVendor = false"
      [class.show]="openDropdownVendor">

      <a class="nav-link dropdown-toggle" role="button" [class.active]="segment === 'vendor'"
        (click)="segment = 'vendor'; goTovendorbulkUpload()">
        Vendor
      </a>

      <ul class="dropdown-menu" [class.show]="openDropdownVendor">
        <li>
          <a class="dropdown-item" (click)="goToVendorList(); segment = 'vendor'">
            Vendor List
          </a>
        </li>
      </ul>
    </li>

    <li class="nav-item">
      <button class="nav-link" type="button" [class.active]="segment === 'viewData'"
        (click)="segment = 'viewData'; goToAbout()">
        View Category
      </button>
    </li>

    <li class="nav-item dropdown" (mouseenter)="openMailDropdown = true" (mouseleave)="openMailDropdown = false"
      [class.show]="openMailDropdown">
      <a class="nav-link dropdown-toggle" href="javascript:void(0)" [class.active]="segment === 'mail'"
        (click)="segment = 'mail'">
        Mail
      </a>
      <ul class="dropdown-menu" [class.show]="openMailDropdown">
        <li>
          <a class="dropdown-item" routerLink="/all-mails" (click)="sendMail(); segment = 'mail'">
            All Mails
          </a>
        </li>
        <li>
          <a class="dropdown-item" routerLink="/drafts" (click)="segment = 'mail'; ">
            Drafts
          </a>
        </li>

      </ul>
    </li>

  </ul>
</div>
