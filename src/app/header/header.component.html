<nav class="navbar navbar-expand-lg navbar-custom">
  <div class="navbar-container">
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
      <img src="https://www.mckinsol.com/assets/siteImage/mckinsol-logo-full.png" alt="Logo" class="me-2 idmx-logo">
    </a>

    <div class="d-flex align-items-center ms-auto gap-4 position-relative">
      <div class="d-flex align-items-center gap-3 dropdown">
        <div class="avatar-wrapper">
          <img [src]="profileImage || ''" (error)="profileImage = ''"
            alt="Profile" class="avatar-img" />

        </div>

        <div class="text-white dropdown-toggle" style="cursor: pointer;" data-bs-toggle="dropdown"
          aria-expanded="false">
          <div class="fw-semibold">{{ userName || 'User' }}</div>
          <small class="text-light opacity-75">{{ userEmail || 'unknown@example.com' }}</small>
        </div>



        <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2 p-2">
          <li>
            <a class="dropdown-item d-flex align-items-center gap-2" (click)="openEditProfileModal()">
              <i class="bi bi-person-circle"></i> Edit Profile
            </a>
          </li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <li>
            <a class="dropdown-item d-flex align-items-center gap-2 text-success" (click)="logout()">
              <i class="bi bi-box-arrow-right"></i> Logout
            </a>
          </li>
        </ul>
      </div>
    </div>

  </div>
</nav>

<div class="modal fade" id="editProfileModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 rounded-3 shadow-sm">
      <div class="modal-header bg-dark text-white rounded-top-3">
        <h5 class="modal-title">Edit Profile</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body text-center p-4">
        <label for="modalProfileUpload" class="d-block mb-3 text-center" style="cursor: pointer;">
          <div class="avatar-wrapper mx-auto">
            <img [src]="profileImage || ''" class="avatar-img" alt="Profile" />
          </div>
          <input type="file" id="modalProfileUpload" hidden accept="image/*" (change)="onFileSelected($event)" />
          <div class="small text-muted mt-2">Click to change</div>
        </label>

        <div class="mb-3 text-start">
          <label class="form-label fw-semibold">Your Name</label>
          <input [(ngModel)]="userName" type="text" class="form-control" placeholder="Enter your name" />
        </div>
      </div>

      <div class="modal-footer border-top-0 px-4 pb-4">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-success" (click)="saveProfile()">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<div class="page-container mt-2">

  <div class="app-header d-flex justify-content-between align-items-center p-3 px-2 shadow-sm bg-white rounded-bottom">
    <div class="d-flex align-items-center gap-2">

      <h4 class="mb-0 fw-bold" style="color: #5ab745;">
        SwiftSend <small class="text-muted fw-normal">by McKinsol</small>

      </h4>
    </div>

    <div class="text-end">
      <span class="badge bg-gradient-success text-dark fw-medium">Secure Mail Platform</span>
    </div>
  </div>



  <ul class="nav nav-tabs">
    <li class="nav-item">
    
     <button class="nav-link" type="button" [class.active]="segment === 'dashboard'"
        (click)="segment = 'dashboard'; goToDashboard()">
        Dashboard
      </button>
    </li>
    <li class="nav-item dropdown" (mouseenter)="openDropdown = true" (mouseleave)="openDropdown = false"
      [class.show]="openDropdown">
      <a class="nav-link dropdown-toggle" routerLink="/candidate-upload" [class.active]="segment === ''" (click)="segment = ''">
        Candidate
      </a>
      <ul class="dropdown-menu" [class.show]="openDropdown">
        <li>
          <a class="dropdown-item" (click)="gotToCanidateList(); segment = ''">
            Candidate List
          </a>
        </li>
      </ul>
    </li>

    <li class="nav-item dropdown" (mouseenter)="openDropdownVendor = true" (mouseleave)="openDropdownVendor = false"
      [class.show]="openDropdownVendor">

      <a class="nav-link dropdown-toggle" role="button" [class.active]="segment === 'vendor'"
        (click)="segment = 'vendor'; goTovendorbulkUpload()">
        Vendor
      </a>

      <ul class="dropdown-menu" [class.show]="openDropdownVendor">
        <li>
          <a class="dropdown-item" (click)="goToVendorList(); segment = 'vendor'">
            Vendor List
          </a>
        </li>
      </ul>
    </li>

    <li class="nav-item">
      <button class="nav-link" type="button" [class.active]="segment === 'viewData'"
        (click)="segment = 'viewData'; goToAbout()">
        View Category
      </button>
    </li>

    <li class="nav-item dropdown" (mouseenter)="openMailDropdown = true" (mouseleave)="openMailDropdown = false"
      [class.show]="openMailDropdown">
      <a class="nav-link dropdown-toggle" href="javascript:void(0)" [class.active]="segment === 'mail'"
        (click)="segment = 'mail'">
        Mail
      </a>
      <ul class="dropdown-menu" [class.show]="openMailDropdown">
        <li>
          <a class="dropdown-item" routerLink="/all-mails" (click)="sendMail(); segment = 'mail'">
            All Mails
          </a>
        </li>
        <li>
          <a class="dropdown-item" routerLink="/drafts" (click)="segment = 'mail'; ">
            Drafts
          </a>
        </li>

      </ul>
    </li>

  </ul>
</div>
