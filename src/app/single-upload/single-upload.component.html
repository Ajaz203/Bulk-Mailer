<form #manualForm="ngForm" class="single-upload-card" (ngSubmit)="save(manualForm)">
  <h2>Single Data Upload</h2>

  <!-- Name -->
  <div class="form-row">
    <label>Name <span style="color: red;"> *</span></label>
    <input
      type="text"
      [(ngModel)]="candidate.name"
      name="name"
      #name="ngModel"
      required
      placeholder="Name"
      [ngClass]="{ 'invalid-input': name.invalid && name.touched, 'valid-input': name.valid && name.touched }"
    />
  </div>

  <!-- Email -->
  <div class="form-row">
    <label>Email <span style="color: red;"> *</span></label>
    <input
      type="email"
      [(ngModel)]="candidate.email"
      name="email"
      #email="ngModel"
      required
      email
      placeholder="Email"
      [ngClass]="{ 'invalid-input': email.invalid && email.touched, 'valid-input': email.valid && email.touched }"
    />
  </div>

  <!-- Contact No -->
<div class="form-row">
  <label>Contact No <span style="color: red;"> *</span></label>
  <input
    type="text"
    [(ngModel)]="candidate.contact_no"
    name="contactNo"
    #contactNo="ngModel"
    required
    maxlength="15"
    placeholder="Contact No"
    (keypress)="allowOnlyNumbers($event)"
    (paste)="handlePaste($event)"
    [ngClass]="{
      'invalid-input': contactNo.invalid && contactNo.touched,
      'valid-input': contactNo.valid && contactNo.touched
    }"
  />
</div>

<div class="form-row">
  <label>Visa Type</label>
  
  <select
    [(ngModel)]="candidate.visa"
    name="visa"
    #visa="ngModel"
    [ngClass]="{
      'invalid-input': visa.invalid && visa.touched,
      'valid-input': visa.valid && visa.touched
    }"
  >
   <option *ngFor="let visa of visaOptions" [value]="visa">{{ visa }}</option>

  </select>
</div>


  <!-- Alternate Contact No -->
  <!-- <div class="form-row">
  <label>Alternate Contact No.</label>
  <input
    type="text"
    [(ngModel)]="candidate.alt_contact_no"
    name="alternateContactNo"
    placeholder="Alternate Contact No."
  />
</div> -->
  <div class="form-row">
  <label>Location</label>
  <input
    type="text"
    [(ngModel)]="candidate.location"
    name="alternateContactNo"
    placeholder="Location"
  />
</div>


  <!-- Category -->
  <div class="form-row">
    <label>Technology</label>
    
    <select
      [(ngModel)]="candidate.technology"
      name="technology"
      #category="ngModel"
      [ngClass]="{ 'invalid-input': category.invalid && category.touched, 'valid-input': category.valid && category.touched 
        
      }"
    >
      <option value="NA">NA</option>
      <option *ngFor="let item of dropDownArr" [value]="item.name">{{ item.name }}</option>
    </select>
  </div>
  


  <!-- Skills -->
  <div class="mb-3">
    <div class="input-fields">
      <label class="form-label mt-3">Add Skills</label>
      <div class="input-group mb-3">
        <input
          type="text"
          id="skillInput"
          class="form-control"
          placeholder="labelname"
          [(ngModel)]="skill"
          (keyup.enter)="addSkill()"
          name="skillInput"
        />
        <button class="btn btn-outline-success" type="button" (click)="addSkill()">+</button>
      </div>
    </div>

    <div class="input-fields">
      <div id="skillTags" class="tag-container d-flex flex-wrap">
        <div
          *ngFor="let sk of skills; let i = index"
          class="badge bg-light m-1 px-3 py-2 rounded-pill d-flex align-items-center"
        >
          {{ sk }}
          <span class="ms-2 text-success" style="cursor: pointer" (click)="removeSkill(i)">x</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="form-actions">
    <button class="btn btn-outline-secondary" type="button" (click)="reset(manualForm)">Reset</button>
    <button class="btn btn-success" type="submit" [disabled]="manualForm.invalid">Save</button>
  </div>
</form>
